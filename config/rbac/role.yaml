---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.fleetd.dev
  resources:
  - clusters
  - workloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.fleetd.dev
  resources:
  - clusters/finalizers
  - workloads/finalizers
  verbs:
  - update
- apiGroups:
  - apps.fleetd.dev
  resources:
  - clusters/status
  - workloads/status
  verbs:
  - get
  - patch
  - update
